# Appended to ~/.dsh/profiles/<profile>/cordis.patch.yml by install.sh.
# The manifest beside the vendored plugin must be named and versioned
# ({"name":"dsh-wsl-file-open","version":"…","private":true,"type":"module"}).
# A name without a version makes every model request fail with
# REQUEST_EXTENSION; a manifest without a name is silently excluded.
# >>> dsh-wsl-file-open >>>
- insert:
    - id: wsl-file-open
      name: './wsl-file-open/index.js'
# <<< dsh-wsl-file-open <<<
