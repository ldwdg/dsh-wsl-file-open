# Appended to ~/.dsh/profiles/<profile>/cordis.patch.yml by install.sh.
# The anonymous package.json beside the plugin is required: DSH's package
# inventory silently excludes a relative plugin whose nearest manifest has no
# `name`. A manifest WITH a name but no version makes every model request fail
# with REQUEST_EXTENSION.
# >>> dsh-wsl-file-open >>>
- insert:
    - id: wsl-file-open
      name: './wsl-file-open/entry.mjs'
# <<< dsh-wsl-file-open <<<
